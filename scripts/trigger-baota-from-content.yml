name: Trigger Baota deployment from content repository

# Install this workflow in the PRIVATE RyuChan-Content repository, not the frontend repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Request frontend rebuild
        env:
          FRONTEND_REPOSITORY: ${{ vars.FRONTEND_REPOSITORY }}
          DISPATCH_TOKEN: ${{ secrets.FRONTEND_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FRONTEND_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo 'Set FRONTEND_REPOSITORY to owner/repo' >&2; exit 1; }
          [[ -n "$DISPATCH_TOKEN" ]] || { echo 'Missing FRONTEND_DISPATCH_TOKEN' >&2; exit 1; }
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -X POST -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d '{"event_type":"content-update","client_payload":{"branch":"main"}}' \
            "https://api.github.com/repos/$FRONTEND_REPOSITORY/dispatches"
