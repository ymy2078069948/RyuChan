name: Deploy RyuChan to Baota

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-update]
  workflow_dispatch:
  schedule:
    - cron: "8,23,38,53 * * * *"

permissions:
  contents: read

concurrency:
  group: baota-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTENT_REPO: ${{ github.workspace }}/ryuchan-content
      PUBLIC_GITHUB_OWNER: ${{ github.repository_owner }}
      PUBLIC_GITHUB_REPO: RyuChan-Content
      PUBLIC_GITHUB_BRANCH: main
      PUBLIC_GITHUB_APP_ID: ${{ vars.PUBLIC_GITHUB_APP_ID }}
      PUBLIC_GITHUB_ENCRYPT_KEY: ${{ vars.PUBLIC_GITHUB_ENCRYPT_KEY }}
      PUBLIC_FRONTEND_REPO: ${{ github.event.repository.name }}
    steps:
      - name: Validate production settings
        env:
          CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
          DEPLOY_KEY: ${{ secrets.BAOTA_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.BAOTA_KNOWN_HOSTS }}
          BAOTA_HOST: ${{ vars.BAOTA_HOST }}
          BAOTA_PORT: ${{ vars.BAOTA_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          for key in CONTENT_TOKEN DEPLOY_KEY KNOWN_HOSTS BAOTA_HOST BAOTA_PORT PUBLIC_GITHUB_APP_ID PUBLIC_GITHUB_ENCRYPT_KEY; do
            if [[ -z "${!key:-}" ]]; then echo "Missing required setting: $key" >&2; exit 1; fi
          done
          [[ "$BAOTA_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Invalid BAOTA_HOST' >&2; exit 1; }
          [[ "$BAOTA_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$BAOTA_PORT > 0 && 10#$BAOTA_PORT <= 65535 )) || { echo 'Invalid BAOTA_PORT' >&2; exit 1; }

      - name: Checkout frontend (includes URL encoding fix)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check publisher and setup script
        run: |
          bash -n scripts/setup-baota-deploy.sh
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_baota_publish.py

      - name: Checkout private content repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RyuChan-Content
          ref: main
          token: ${{ secrets.CONTENT_TOKEN }}
          persist-credentials: false
          path: ryuchan-content

      - name: Configure pinned SSH
        env:
          DEPLOY_KEY: ${{ secrets.BAOTA_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.BAOTA_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/ryuchan-deploy"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ryuchan-deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/ryuchan-deploy" >/dev/null
          ssh-keygen -lf "$HOME/.ssh/known_hosts" >/dev/null

      - name: Check whether private content changed
        id: freshness
        env:
          BAOTA_HOST: ${{ vars.BAOTA_HOST }}
          BAOTA_PORT: ${{ vars.BAOTA_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          content_sha="$(git -C ryuchan-content rev-parse HEAD)"
          printf 'content_sha=%s\n' "$content_sha" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != schedule ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ssh_options=(-i "$HOME/.ssh/ryuchan-deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15)
          live_sha="$(ssh "${ssh_options[@]}" -p "$BAOTA_PORT" "ryuchan-deploy@$BAOTA_HOST" 'cat /www/wwwroot/luokk.top/.ryuchan-content-sha 2>/dev/null || true')"
          if [[ "$live_sha" == "$content_sha" ]]; then
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo "Content is already deployed: $content_sha"
          else
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            echo "Content changed: $content_sha"
          fi

      - name: Setup pnpm
        if: steps.freshness.outputs.deploy == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install and build
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -s dist/index.html
          test -s dist/config/index.html
          grep -q 'encodeGitHubPath' src/lib/github-client.ts || { echo 'Frontend URL fix has not been committed' >&2; exit 1; }

      - name: Include checked-out content commit in the site
        if: steps.freshness.outputs.deploy == 'true'
        run: printf '%s\n' '${{ steps.freshness.outputs.content_sha }}' > dist/.ryuchan-content-sha

      - name: Detect manifest-capable publisher
        if: steps.freshness.outputs.deploy == 'true'
        id: manifest
        env:
          BAOTA_HOST: ${{ vars.BAOTA_HOST }}
          BAOTA_PORT: ${{ vars.BAOTA_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-i "$HOME/.ssh/ryuchan-deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15)
          if ssh "${ssh_options[@]}" -p "$BAOTA_PORT" "ryuchan-deploy@$BAOTA_HOST" 'grep -q ".ryuchan-manifest" /usr/local/sbin/ryuchan-publish 2>/dev/null'; then
            echo 'supported=true' >> "$GITHUB_OUTPUT"
          else
            echo 'supported=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Package static site
        if: steps.freshness.outputs.deploy == 'true'
        id: package
        env:
          BAOTA_HOST: ${{ vars.BAOTA_HOST }}
          BAOTA_PORT: ${{ vars.BAOTA_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ryuchan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          manifest="$RUNNER_TEMP/ryuchan-manifest.txt"
          ( cd dist && find . -type f -not -name '.user.ini' -print0 | sort -z | xargs -0 sha256sum ) > "$manifest"
          publish=false
          if [[ "${{ steps.manifest.outputs.supported }}" == 'true' ]]; then
            ssh_options=(-i "$HOME/.ssh/ryuchan-deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15)
            if live=$(ssh "${ssh_options[@]}" -p "$BAOTA_PORT" "ryuchan-deploy@$BAOTA_HOST" 'cd /www/wwwroot/luokk.top && find . -type f -not -name .user.ini -not -name .htaccess -print0 | sort -z | xargs -0 sha256sum' 2>/dev/null); then
              printf '%s\n' "$live" > "$RUNNER_TEMP/ryuchan-live.txt"
              awk 'NR==FNR { live[substr($0,67)]=substr($0,1,64); next } { path=substr($0,67); if (!(path in live) || live[path]!=substr($0,1,64)) print path }' "$RUNNER_TEMP/ryuchan-live.txt" "$manifest" > "$RUNNER_TEMP/ryuchan-changed.txt"
              if [[ -s "$RUNNER_TEMP/ryuchan-changed.txt" ]]; then
                cp "$manifest" dist/.ryuchan-manifest
                printf '%s\n' './.ryuchan-manifest' >> "$RUNNER_TEMP/ryuchan-changed.txt"
                tar -C dist -czf "$archive" -T "$RUNNER_TEMP/ryuchan-changed.txt"
                rm -f dist/.ryuchan-manifest
                echo "Incremental bundle: $(wc -c < "$archive") bytes, $(wc -l < "$RUNNER_TEMP/ryuchan-changed.txt") entries" >&2
                publish=true
              else
                echo 'Built site already matches the live site; nothing to publish.' >&2
              fi
            else
              echo 'Live manifest unavailable; falling back to a full bundle.' >&2
              tar -C dist -czf "$archive" .
              publish=true
            fi
          else
            echo 'Publisher without manifest support; sending a full bundle.' >&2
            tar -C dist -czf "$archive" .
            publish=true
          fi
          if [[ "$publish" == 'true' ]]; then
            printf 'publish=true\n' >> "$GITHUB_OUTPUT"
            printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
            printf 'sha256=%s\n' "$(sha256sum "$archive" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            printf 'publish=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish via pinned SSH host key
        if: steps.freshness.outputs.deploy == 'true' && steps.package.outputs.publish == 'true'
        env:
          BAOTA_HOST: ${{ vars.BAOTA_HOST }}
          BAOTA_PORT: ${{ vars.BAOTA_PORT }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          remote_archive="/home/ryuchan-deploy/incoming/ryuchan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          ssh_options=(-i "$HOME/.ssh/ryuchan-deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15)
          scp "${ssh_options[@]}" -P "$BAOTA_PORT" "$ARCHIVE" "ryuchan-deploy@$BAOTA_HOST:$remote_archive"
          ssh "${ssh_options[@]}" -p "$BAOTA_PORT" "ryuchan-deploy@$BAOTA_HOST" "sudo -n /usr/local/sbin/ryuchan-publish $remote_archive $SHA256"
